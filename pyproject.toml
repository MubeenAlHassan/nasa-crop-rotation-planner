[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift"
version = "0.0.1"
description = "Field Shift: verified agricultural data fixtures"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "pandas==2.3.3",
  "numpy==2.3.5",
  "uvicorn==0.54.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.12.12", "h5py==3.16.0"]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.venv*", "backend.tests*", "backend.scripts*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["backend/scripts", "backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
